services:
  - type: web
    name: verity-scratch-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: SCRATCH_USERNAME
        sync: false
      - key: SCRATCH_PASSWORD
        sync: false
      - key: SCRATCH_PROJECT_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: liquid/lfm-2.5-2.6b:free
      - key: PORT
        value: 10000
